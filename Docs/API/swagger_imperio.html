<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ImperioDelivery — Swagger UI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css"/>
  <style>
    body { margin: 0; background: #fafafa; }
    .swagger-ui .topbar { background: #f97316; }
    .swagger-ui .topbar .download-url-wrapper { display: none; }
    .swagger-ui .info .title { font-size: 2rem; }
  </style>
</head>
<body>
<div id="swagger-ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-standalone-preset.min.js"></script>

<script>
const spec = {
  openapi: "3.0.3",
  info: {
    title: "ImperioDelivery API",
    description: `
## Sobre
API REST do sistema **ImperioDelivery**, construída em Node.js com Express.

Gerencia usuários, produtos, carrinho de compras e pedidos.

- **Autenticação:** Firebase ID Token (Bearer JWT)
- **Banco de dados:** Firebase Firestore
- **Upload de imagens:** Cloudinary
- **Porta padrão:** 2580

## Como autenticar
1. Faça login em \`POST /login\` e obtenha o token
2. Clique em **Authorize** (🔒) e cole o token no campo \`Bearer\`
3. Todas as rotas protegidas passarão o token automaticamente

## Níveis de acesso
| Nível | Descrição |
|-------|-----------|
| 🟢 Público | Sem autenticação |
| 🔵 Autenticado | Requer Bearer token válido |
| 🟡 Gerente | Requer Bearer token + tipo \`gerente\` no Firestore |
    `,
    version: "1.0.0",
    contact: { name: "ImperioDelivery" }
  },
  servers: [
    { url: "http://localhost:2580", description: "Servidor local" }
  ],
  components: {
    securitySchemes: {
      BearerAuth: {
        type: "http",
        scheme: "bearer",
        bearerFormat: "JWT",
        description: "Firebase ID Token obtido após login"
      }
    },
    schemas: {
      Sucesso: {
        type: "object",
        properties: {
          success: { type: "boolean", example: true },
          data: { type: "object" }
        }
      },
      Erro: {
        type: "object",
        properties: {
          success: { type: "boolean", example: false },
          message: { type: "string", example: "Mensagem de erro" }
        }
      },
      Usuario: {
        type: "object",
        properties: {
          uid:      { type: "string", example: "abc123uid" },
          nome:     { type: "string", example: "João Silva" },
          email:    { type: "string", example: "joao@email.com" },
          telefone: { type: "string", example: "(11) 91234-5678" },
          tipo:     { type: "string", enum: ["cliente","funcionario","gerente"], example: "cliente" },
          endereco: { type: "string", example: "Rua das Flores, 100" }
        }
      },
      Produto: {
        type: "object",
        properties: {
          id:        { type: "string", example: "prod_xyz789" },
          nome:      { type: "string", example: "Pizza Margherita" },
          descricao: { type: "string", example: "Pizza tradicional com molho de tomate e mussarela" },
          valor:     { type: "number", example: 42.90 },
          imagem:    { type: "string", example: "https://res.cloudinary.com/.../pizza.jpg" },
          categoria: { type: "string", example: "Pizzas" }
        }
      },
      ItemCarrinho: {
        type: "object",
        properties: {
          produtoId:  { type: "string", example: "prod_xyz789" },
          nome:       { type: "string", example: "Pizza Margherita" },
          descricao:  { type: "string", example: "Pizza tradicional" },
          valor:      { type: "number", example: 42.90 },
          imagem:     { type: "string", example: "https://res.cloudinary.com/.../pizza.jpg" },
          categoria:  { type: "string", example: "Pizzas" },
          quantidade: { type: "integer", example: 2 }
        }
      },
      Carrinho: {
        type: "object",
        properties: {
          uid:   { type: "string", example: "abc123uid" },
          tipo:  { type: "string", example: "delivery" },
          itens: { type: "array", items: { "$ref": "#/components/schemas/ItemCarrinho" } }
        }
      },
      Pedido: {
        type: "object",
        properties: {
          id:               { type: "string", example: "ped_001" },
          uid:              { type: "string", example: "abc123uid" },
          itens:            { type: "array", items: { "$ref": "#/components/schemas/ItemCarrinho" } },
          enderecoEntrega:  { type: "string", example: "Rua das Flores, 100" },
          formaPagamento:   { type: "string", example: "cartao_credito" },
          observacao:       { type: "string", example: "Sem cebola" },
          status:           { type: "string", enum: ["pendente","em_preparo","saiu_para_entrega","entregue","cancelado"], example: "pendente" }
        }
      }
    }
  },

  tags: [
    { name: "👤 Usuário",  description: "Registro, login e gerenciamento de conta" },
    { name: "📦 Produtos", description: "Listagem e gestão de produtos (CRUD)" },
    { name: "🛒 Carrinho", description: "Gerenciamento do carrinho do usuário autenticado" },
    { name: "🧾 Pedidos",  description: "Finalização e acompanhamento de pedidos" }
  ],

  paths: {

    /* ─────────────────────────── USUÁRIO ─────────────────────────── */

    "/register": {
      post: {
        tags: ["👤 Usuário"],
        summary: "Registrar cliente",
        description: "Cria uma nova conta de **cliente**. O campo `tipo` é definido automaticamente como `cliente`.",
        operationId: "registerCliente",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                required: ["nome","email","password"],
                properties: {
                  nome:     { type: "string", example: "João Silva" },
                  email:    { type: "string", example: "joao@email.com" },
                  password: { type: "string", example: "senha123" },
                  telefone: { type: "string", example: "(11) 91234-5678" },
                  endereco: { type: "string", example: "Rua das Flores, 100" }
                }
              }
            }
          }
        },
        responses: {
          "201": {
            description: "Usuário criado com sucesso",
            content: {
              "application/json": {
                schema: { "$ref": "#/components/schemas/Sucesso" },
                example: { success: true, data: { uid: "abc123", nome: "João Silva", email: "joao@email.com", tipo: "cliente" } }
              }
            }
          },
          "400": {
            description: "Dados inválidos ou e-mail já cadastrado",
            content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" }, example: { success: false, message: "E-mail já em uso" } } }
          }
        }
      }
    },

    "/funcionario": {
      post: {
        tags: ["👤 Usuário"],
        summary: "Registrar funcionário",
        description: "Cria uma conta de **funcionário**. Requer autenticação e permissão de **gerente**.",
        operationId: "registerFuncionario",
        security: [{ BearerAuth: [] }],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                required: ["nome","email","password"],
                properties: {
                  nome:     { type: "string", example: "Maria Souza" },
                  email:    { type: "string", example: "maria@imperio.com" },
                  password: { type: "string", example: "senha456" },
                  telefone: { type: "string", example: "(11) 98765-4321" },
                  endereco: { type: "string", example: "Av. Central, 200" }
                }
              }
            }
          }
        },
        responses: {
          "201": { description: "Funcionário criado com sucesso", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" }, example: { success: true, data: { uid: "func456", nome: "Maria Souza", tipo: "funcionario" } } } } },
          "401": { description: "Token não fornecido ou inválido", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "403": { description: "Acesso negado — apenas gerentes podem criar funcionários", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" }, example: { success: false, message: "Acesso negado" } } } }
        }
      }
    },

    "/login": {
      post: {
        tags: ["👤 Usuário"],
        summary: "Login",
        description: "Autentica o usuário e retorna o **Firebase ID Token** que deve ser usado no header `Authorization: Bearer <token>` em todas as rotas protegidas.",
        operationId: "login",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                required: ["email","password"],
                properties: {
                  email:    { type: "string", example: "joao@email.com" },
                  password: { type: "string", example: "senha123" }
                }
              }
            }
          }
        },
        responses: {
          "200": {
            description: "Login bem-sucedido",
            content: {
              "application/json": {
                schema: { "$ref": "#/components/schemas/Sucesso" },
                example: { success: true, data: { token: "eyJhbGci...firebase_token", uid: "abc123", email: "joao@email.com" } }
              }
            }
          },
          "401": { description: "E-mail ou senha incorretos", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" }, example: { success: false, message: "Credenciais inválidas" } } } }
        }
      }
    },

    "/user": {
      put: {
        tags: ["👤 Usuário"],
        summary: "Atualizar conta",
        description: "Atualiza os dados do usuário autenticado. O `uid` é extraído do token automaticamente.",
        operationId: "updateUser",
        security: [{ BearerAuth: [] }],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  nome:     { type: "string", example: "João Atualizado" },
                  email:    { type: "string", example: "joao_novo@email.com" },
                  password: { type: "string", example: "novaSenha789" },
                  telefone: { type: "string", example: "(11) 90000-1111" },
                  endereco: { type: "string", example: "Rua Nova, 50" }
                }
              }
            }
          }
        },
        responses: {
          "200": { description: "Dados atualizados com sucesso", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" } } } },
          "400": { description: "Erro na atualização", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      },
      delete: {
        tags: ["👤 Usuário"],
        summary: "Deletar conta",
        description: "Remove permanentemente a conta do usuário autenticado.",
        operationId: "deleteUser",
        security: [{ BearerAuth: [] }],
        responses: {
          "200": { description: "Conta deletada com sucesso", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" } } } },
          "400": { description: "Erro ao deletar", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    /* ─────────────────────────── PRODUTOS ─────────────────────────── */

    "/produto": {
      get: {
        tags: ["📦 Produtos"],
        summary: "Listar todos os produtos",
        description: "Retorna todos os produtos cadastrados. **Rota pública**, não requer autenticação.",
        operationId: "getAllProdutos",
        responses: {
          "200": {
            description: "Lista de produtos",
            content: {
              "application/json": {
                schema: { "$ref": "#/components/schemas/Sucesso" },
                example: {
                  success: true,
                  data: [
                    { id: "prod_001", nome: "Pizza Margherita", descricao: "Clássica italiana", valor: 42.90, imagem: "https://cloudinary.com/pizza.jpg", categoria: "Pizzas" },
                    { id: "prod_002", nome: "Coca-Cola 2L", descricao: "Refrigerante gelado", valor: 12.00, imagem: "https://cloudinary.com/coca.jpg", categoria: "Bebidas" }
                  ]
                }
              }
            }
          },
          "400": { description: "Erro ao buscar produtos", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      },
      post: {
        tags: ["📦 Produtos"],
        summary: "Criar produto",
        description: "Cria um novo produto com upload opcional de imagem via **multipart/form-data**. Requer permissão de **gerente**.",
        operationId: "newProduto",
        security: [{ BearerAuth: [] }],
        requestBody: {
          required: true,
          content: {
            "multipart/form-data": {
              schema: {
                type: "object",
                required: ["nome","valor"],
                properties: {
                  nome:      { type: "string", example: "Pizza Calabresa" },
                  descricao: { type: "string", example: "Pizza com calabresa e cebola" },
                  valor:     { type: "number", example: 45.90 },
                  categoria: { type: "string", example: "Pizzas" },
                  imagem:    { type: "string", format: "binary", description: "Arquivo de imagem (jpg, png, webp)" }
                }
              }
            }
          }
        },
        responses: {
          "201": { description: "Produto criado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" }, example: { success: true, message: "Produto criado com sucesso!", data: { id: "prod_003", nome: "Pizza Calabresa", valor: 45.90 } } } } },
          "400": { description: "Dados inválidos", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "403": { description: "Acesso negado — somente gerentes", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "500": { description: "Erro interno (ex: falha no upload)", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    "/produto/{id}": {
      get: {
        tags: ["📦 Produtos"],
        summary: "Buscar produto por ID",
        description: "Retorna um produto específico pelo seu ID. **Rota pública**.",
        operationId: "getProduto",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" }, example: "prod_001", description: "ID do produto" }],
        responses: {
          "200": { description: "Produto encontrado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" }, example: { success: true, data: { id: "prod_001", nome: "Pizza Margherita", valor: 42.90 } } } } },
          "404": { description: "Produto não encontrado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" }, example: { success: false, message: "Produto não encontrado" } } } },
          "500": { description: "Erro interno", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      },
      put: {
        tags: ["📦 Produtos"],
        summary: "Atualizar produto",
        description: "Atualiza dados de um produto existente. Pode enviar nova imagem. Requer permissão de **gerente**.",
        operationId: "updateProduto",
        security: [{ BearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" }, example: "prod_001", description: "ID do produto" }],
        requestBody: {
          content: {
            "multipart/form-data": {
              schema: {
                type: "object",
                properties: {
                  nome:      { type: "string", example: "Pizza Margherita Especial" },
                  descricao: { type: "string", example: "Com borda recheada" },
                  valor:     { type: "number", example: 49.90 },
                  categoria: { type: "string", example: "Pizzas" },
                  imagem:    { type: "string", format: "binary" }
                }
              }
            }
          }
        },
        responses: {
          "200": { description: "Produto atualizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" }, example: { success: true, message: "Produto atualizado com sucesso!" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "403": { description: "Acesso negado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "404": { description: "Produto não encontrado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      },
      delete: {
        tags: ["📦 Produtos"],
        summary: "Deletar produto",
        description: "Remove um produto do sistema. Requer permissão de **gerente**.",
        operationId: "deleteProduto",
        security: [{ BearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" }, example: "prod_001", description: "ID do produto" }],
        responses: {
          "200": { description: "Produto deletado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" }, example: { success: true, message: "Produto deletado com sucesso!" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "403": { description: "Acesso negado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "404": { description: "Produto não encontrado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    /* ─────────────────────────── CARRINHO ─────────────────────────── */

    "/carrinho": {
      get: {
        tags: ["🛒 Carrinho"],
        summary: "Buscar carrinho do usuário",
        description: "Retorna o carrinho atual do usuário autenticado, incluindo todos os itens.",
        operationId: "getCarrinho",
        security: [{ BearerAuth: [] }],
        responses: {
          "200": {
            description: "Carrinho encontrado",
            content: {
              "application/json": {
                schema: { "$ref": "#/components/schemas/Sucesso" },
                example: { success: true, data: { uid: "abc123", tipo: "delivery", itens: [{ produtoId: "prod_001", nome: "Pizza Margherita", valor: 42.90, quantidade: 1 }] } }
              }
            }
          },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "404": { description: "Carrinho vazio ou não encontrado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      },
      post: {
        tags: ["🛒 Carrinho"],
        summary: "Salvar / sobrescrever carrinho",
        description: "Salva (ou substitui completamente) o carrinho do usuário com uma lista de itens e tipo de pedido.",
        operationId: "saveCarrinho",
        security: [{ BearerAuth: [] }],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                required: ["itens"],
                properties: {
                  tipo:  { type: "string", example: "delivery", description: "Tipo do pedido: delivery ou retirada" },
                  itens: { type: "array", items: { "$ref": "#/components/schemas/ItemCarrinho" } }
                }
              },
              example: {
                tipo: "delivery",
                itens: [
                  { produtoId: "prod_001", nome: "Pizza Margherita", valor: 42.90, quantidade: 2, categoria: "Pizzas" }
                ]
              }
            }
          }
        },
        responses: {
          "200": { description: "Carrinho salvo", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" } } } },
          "400": { description: "Erro ao salvar", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      },
      delete: {
        tags: ["🛒 Carrinho"],
        summary: "Limpar carrinho",
        description: "Remove todos os itens do carrinho do usuário autenticado.",
        operationId: "clearCarrinho",
        security: [{ BearerAuth: [] }],
        responses: {
          "200": { description: "Carrinho limpo com sucesso", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" } } } },
          "400": { description: "Erro ao limpar", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    "/carrinho/item": {
      post: {
        tags: ["🛒 Carrinho"],
        summary: "Adicionar item ao carrinho",
        description: "Adiciona um único produto ao carrinho do usuário. Se o item já existir, incrementa a quantidade.",
        operationId: "addItem",
        security: [{ BearerAuth: [] }],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: { "$ref": "#/components/schemas/ItemCarrinho" },
              example: {
                produtoId: "prod_001",
                nome: "Pizza Margherita",
                descricao: "Clássica italiana",
                valor: 42.90,
                imagem: "https://cloudinary.com/pizza.jpg",
                categoria: "Pizzas",
                quantidade: 1
              }
            }
          }
        },
        responses: {
          "200": { description: "Item adicionado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" } } } },
          "400": { description: "Erro ao adicionar item", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    "/carrinho/item/{produtoId}": {
      delete: {
        tags: ["🛒 Carrinho"],
        summary: "Remover item do carrinho",
        description: "Remove um produto específico do carrinho pelo ID do produto.",
        operationId: "removeItem",
        security: [{ BearerAuth: [] }],
        parameters: [{ name: "produtoId", in: "path", required: true, schema: { type: "string" }, example: "prod_001", description: "ID do produto a remover" }],
        responses: {
          "200": { description: "Item removido", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" } } } },
          "400": { description: "Erro ao remover", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    /* ─────────────────────────── PEDIDOS ─────────────────────────── */

    "/pedido": {
      post: {
        tags: ["🧾 Pedidos"],
        summary: "Finalizar pedido",
        description: "Cria um pedido com base nos itens do carrinho atual do usuário. **O carrinho é limpo automaticamente** após o pedido ser criado.",
        operationId: "finalizarPedido",
        security: [{ BearerAuth: [] }],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                required: ["enderecoEntrega","formaPagamento"],
                properties: {
                  enderecoEntrega: { type: "string", example: "Rua das Flores, 100 — Apto 12" },
                  formaPagamento:  { type: "string", example: "cartao_credito", description: "Ex: pix, dinheiro, cartao_credito, cartao_debito" },
                  observacao:      { type: "string", example: "Sem cebola, por favor" }
                }
              }
            }
          }
        },
        responses: {
          "201": {
            description: "Pedido realizado com sucesso",
            content: {
              "application/json": {
                schema: { "$ref": "#/components/schemas/Sucesso" },
                example: { success: true, message: "Pedido realizado com sucesso!", data: { id: "ped_001", status: "pendente" } }
              }
            }
          },
          "400": { description: "Carrinho vazio ou dados inválidos", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" }, example: { success: false, message: "Carrinho vazio" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    "/pedido/me": {
      get: {
        tags: ["🧾 Pedidos"],
        summary: "Meus pedidos",
        description: "Retorna todos os pedidos do usuário autenticado.",
        operationId: "getMeusPedidos",
        security: [{ BearerAuth: [] }],
        responses: {
          "200": {
            description: "Lista de pedidos do usuário",
            content: {
              "application/json": {
                schema: { "$ref": "#/components/schemas/Sucesso" },
                example: { success: true, data: [{ id: "ped_001", status: "entregue" }, { id: "ped_002", status: "em_preparo" }] }
              }
            }
          },
          "400": { description: "Erro ao buscar pedidos", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    "/pedido/{id}": {
      get: {
        tags: ["🧾 Pedidos"],
        summary: "Buscar pedido por ID",
        description: "Retorna os detalhes completos de um pedido específico. O usuário deve estar autenticado.",
        operationId: "getPedido",
        security: [{ BearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" }, example: "ped_001", description: "ID do pedido" }],
        responses: {
          "200": { description: "Pedido encontrado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" }, example: { success: true, data: { id: "ped_001", itens: [], status: "em_preparo", formaPagamento: "pix" } } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "404": { description: "Pedido não encontrado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    "/pedidos": {
      get: {
        tags: ["🧾 Pedidos"],
        summary: "Listar todos os pedidos",
        description: "Retorna todos os pedidos de todos os usuários. Requer permissão de **gerente**.",
        operationId: "getAllPedidos",
        security: [{ BearerAuth: [] }],
        responses: {
          "200": { description: "Lista completa de pedidos", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "403": { description: "Acesso negado — somente gerentes", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    },

    "/pedido/{id}/status": {
      put: {
        tags: ["🧾 Pedidos"],
        summary: "Atualizar status do pedido",
        description: "Atualiza o status de um pedido. Requer permissão de **gerente**.\n\nStatus disponíveis: `pendente`, `em_preparo`, `saiu_para_entrega`, `entregue`, `cancelado`",
        operationId: "updateStatus",
        security: [{ BearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" }, example: "ped_001", description: "ID do pedido" }],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                required: ["status"],
                properties: {
                  status: { type: "string", enum: ["pendente","em_preparo","saiu_para_entrega","entregue","cancelado"], example: "em_preparo" }
                }
              }
            }
          }
        },
        responses: {
          "200": { description: "Status atualizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Sucesso" }, example: { success: true, data: { id: "ped_001", status: "em_preparo" } } } } },
          "400": { description: "Erro ao atualizar", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "401": { description: "Não autorizado", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } },
          "403": { description: "Acesso negado — somente gerentes", content: { "application/json": { schema: { "$ref": "#/components/schemas/Erro" } } } }
        }
      }
    }
  }
};

window.onload = () => {
  SwaggerUIBundle({
    spec,
    dom_id: '#swagger-ui',
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
    layout: "StandaloneLayout",
    deepLinking: true,
    defaultModelsExpandDepth: 1,
    defaultModelExpandDepth: 2,
    docExpansion: "list",
    filter: true,
    tryItOutEnabled: false,
  });
};
</script>
</body>
</html>
